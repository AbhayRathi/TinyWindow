[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Exclude Rust integration tests from default test runs (they need wheels installed)
addopts = -v --strict-markers --ignore=tests/integration/test_telemetry.py --ignore=tests/integration/test_rust_encryption_api.py --ignore=tests/integration/test_rust_encryption_comprehensive.py
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
