[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tinywindow"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "alpaca-py>=0.25.0",
    "yfinance>=0.2.36",
    "python-binance>=1.0.19",
    "praw>=7.7.0",
    "tweepy>=4.14.0",
    "pymongo>=4.6.0",
    "motor>=3.3.0",
    "redis>=5.0.1",
    "pandas-ta>=0.3.14b0",
    "vaderSentiment>=3.3.2",
    "python-dotenv>=1.0.0",
    "httpx>=0.25.0",
    "tenacity>=8.2.3",
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.12.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
